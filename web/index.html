<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VoodooHome S2</title>
    <style>
      body {
        background-color: #d38b8b;
      }
      html, body, #root { height: 100%; margin: 0; }
      #root { display: flex; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var tag = document.createElement('div');
        tag.id = 'bundle-status';
        tag.textContent = 'HTML loaded, awaiting bundle…';
        tag.style.position = 'fixed';
        tag.style.bottom = '6px';
        tag.style.left = '8px';
        tag.style.background = 'rgba(0,0,0,0.4)';
        tag.style.color = '#fff';
        tag.style.padding = '4px 8px';
        tag.style.fontSize = '12px';
        tag.style.borderRadius = '4px';
        tag.style.zIndex = '9999';
        document.body.appendChild(tag);
      })();
    </script>
    <script src="/bundle.js" defer onload="(function(){var el=document.getElementById('bundle-status'); if(el) el.textContent='Bundle loaded ✔';})()" onerror="(function(){var el=document.getElementById('bundle-status'); if(el) el.textContent='Bundle failed to load ✖';})()"></script>
  </body>
  </html>
